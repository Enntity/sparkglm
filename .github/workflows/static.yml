name: Static qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the one source-test dependency
        run: python -m pip install 'Jinja2>=3.1,<4'
      - name: Run source and evidence gates
        run: scripts/check.sh all
