name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Launch contract
        run: python3 -m unittest discover -s install -p 'test_*.py' -v
      - name: Overlay converter
        run: python3 -m unittest discover -s install/converter -v
      - name: Host checks
        run: python3 -m unittest discover -s tests -v
      - name: Shell scripts
        run: shellcheck -S warning -e SC2054 start.sh gpu-clock-cap.sh install/*.sh bench/run.sh
      - name: Shared benchmark entry point
        run: |
          bench/run.sh --help
          python3 -m unittest discover -s bench/sparkmodelbench
      - name: Benchmark drivers compile
        run: python3 -m py_compile bench/archive/*.py
      - name: Result receipts
        run: for d in results/*/; do (cd "$d" && sha256sum -c --quiet SHA256SUMS); done
