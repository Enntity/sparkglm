name: Static qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the one source-test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run source and evidence gates
        run: scripts/check.sh all
      - name: Enforce runtime commit provenance
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_commit_provenance.py "$BASE_SHA" "$HEAD_SHA"
